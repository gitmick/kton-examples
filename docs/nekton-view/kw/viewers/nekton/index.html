<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kton · nekton</title>
<link rel="icon" type="image/png" href="../../core/logo.png">
<link rel="stylesheet" href="../../core/kton.css">
<style>
  /* the signer palette is the graph viewer's, in the same order (the published names, sorted), so a
     party has one colour in the lens, the graph and here */
  :root { --a:#38bdf8; --b:#f5b642; --c:#34d399; --d:#c084fc; --e:#fb7185; --f:#e2e8f0; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 var(--sans); }
  header { padding:11px 18px 10px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header img { height:28px; filter:var(--logo-filter); }
  header h1 { font-size:16px; margin:0; font-weight:650; } header h1 small { color:var(--dim); font-weight:400; font-size:12.5px; }
  #crumbs { font-size:13px; color:var(--dim); } #crumbs a { color:var(--accent); cursor:pointer; text-decoration:none; }
  #keyrow { margin-left:auto; display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2); align-items:center; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:-1px; flex:none; }
  main { padding:18px 20px 60px; max-width:1180px; margin:0 auto; }
  .msg { color:var(--dim); font-size:13px; padding:8px 0; } .bad { color:var(--bad); } .ok { color:var(--ok); }
  code, .mono { font-family:var(--mono); font-size:12px; }
  .lede { color:var(--ink2); font-size:13.5px; margin:0 0 14px; max-width:820px; }
  /* overview */
  #ov svg { width:100%; height:auto; display:block; }
  #ov .node { cursor:pointer; } #ov .node:hover rect.box { stroke:var(--accent); }
  #ov text { fill:var(--ink); font-family:var(--sans); } #ov .dimt { fill:var(--dim); } #ov .okt { fill:var(--ok); } #ov .badt { fill:var(--bad); }
  /* one scope */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 16px; margin:0 0 14px; }
  .card h2 { font-size:19px; margin:0 0 4px; } .card h3 { font-size:14px; margin:0 0 8px; color:var(--ink); }
  .kv { font-size:13px; color:var(--ink2); margin:3px 0; } .kv b { color:var(--ink); }
  .acts { display:flex; gap:8px; margin-top:9px; flex-wrap:wrap; }
  .btn { font:inherit; font-size:12.5px; padding:4px 11px; border:1px solid var(--line); border-radius:7px; background:var(--panel2); color:var(--ink); cursor:pointer; text-decoration:none; }
  .btn:hover { border-color:var(--accent); }
  table.dl { border-collapse:collapse; font-size:13px; margin-top:4px; }
  table.dl th, table.dl td { border-bottom:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }
  table.dl th { color:var(--dim); font-weight:500; font-size:12px; }
  table.dl td.c { text-align:center; }
  ol.chain { list-style:none; margin:0; padding:0; position:relative; }
  ol.chain::before { content:""; position:absolute; left:17px; top:18px; bottom:18px; width:2px; background:var(--line); }
  ol.chain li { position:relative; display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:10px; align-items:start; padding:4px 0; }
  ol.chain .n { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font:600 12px var(--mono); color:#0e1216; position:relative; z-index:1; }
  ol.chain .body { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:6px 12px; min-width:0; }
  ol.chain li.hl .body { border-color:var(--accent); }
  .pred { display:inline-block; font:600 12px var(--mono); padding:1px 8px; border-radius:99px; background:var(--panel2); border:1px solid var(--line); color:var(--ink); margin-right:6px; }
  .tri { font-size:13.5px; margin-top:4px; overflow-wrap:anywhere; } .tri .lbl { color:var(--dim); font-size:12px; margin-right:4px; }
  .ref { color:var(--ink); } a.ref { color:var(--accent); cursor:pointer; text-decoration:none; } a.ref:hover { text-decoration:underline; }
  .val { color:var(--ink); font-style:italic; }
  .meta { font-size:11.5px; color:var(--dim); margin-top:2px; }
  .side { display:flex; flex-direction:row; gap:10px; padding-top:8px; align-items:flex-end; font-size:12px; }
  .side a { color:var(--accent); text-decoration:none; cursor:pointer; } .side a:hover { text-decoration:underline; }
  .tick { font-size:12px; }
  .note { font-size:12.5px; color:var(--dim); margin-top:8px; }
</style>
</head>
<body>
<header>
  <img src="../../core/logo.png" alt="">
  <h1>nekton <small>scopes, their chains, and what they say</small></h1>
  <span id="crumbs"></span>
  <span id="keyrow"></span>
</header>
<main>
  <div id="msg" class="msg">loading the scopes and the kernel…</div>
  <section id="ov" hidden></section>
  <section id="one" hidden></section>
</main>
<script type="module" src="nekton.js"></script>
</body>
</html>
